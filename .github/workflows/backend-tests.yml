name: backend-tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Report every service's result, not just the first to break.
      fail-fast: false
      matrix:
        service:
          - users-service
          - mission-design-service
          - scoring-monitoring-service
          - session-operations-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The Testcontainers suites skip themselves when they cannot reach the
      # Docker daemon (DockerAvailability.StartOrSkipAsync). A skip is a PASS to
      # dotnet, so without this the messaging guardrail could silently evaporate
      # and the job would still be green. Fail loudly and early instead.
      - name: Verify Docker daemon is reachable
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Docker daemon unreachable — Testcontainers suites would skip and the run would be a false green."
            exit 1
          fi
          docker version --format 'Docker {{.Server.Version}}'

      # `make` is the repository's single toolchain entrypoint (see backend/Makefile).
      # `build` also runs the structure-guard and layer-guard (Clean Architecture
      # dependency rule); `gate` runs the unit + Testcontainers integration projects
      # and enforces aggregate coverage.
      # The same entrypoint developers run locally: architecture guards, build,
      # unit + integration tests, the Coverlet threshold, and required reports.
      - name: Run local CI contract
        run: make -C backend ci SVC=${{ matrix.service }}

      # The authoritative guard against a false green. dotnet reports a skipped
      # test as a pass, so assert the count is zero rather than trusting the exit
      # code. No test in this repo is skipped by design (no `Skip=` attributes),
      # so any skip here means the environment degraded — most likely Docker.
      - name: Assert no tests were skipped
        run: |
          log="backend/.make-logs/gate-${{ matrix.service }}.log"
          if [ ! -f "$log" ]; then
            echo "::error::Expected test log missing: $log"
            exit 1
          fi
          if grep -hE 'Skipped: *[1-9]' "$log"; then
            echo "::error::Tests were SKIPPED (see the summary lines above). A skip is not a pass — most likely Testcontainers could not reach Docker."
            exit 1
          fi
          echo "No skipped tests."
          grep -hE 'Passed!' "$log" || true

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          # Upload from the common root so the service directory is retained
          # when the post-matrix job merges all four artifacts.
          path: backend/coverage/
          # A compile/test failure can occur before Coverlet emits a report;
          # preserve that original failure instead of replacing it here.
          if-no-files-found: warn
          retention-days: 14

      - name: Upload make logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-logs-${{ matrix.service }}
          path: backend/.make-logs/
          if-no-files-found: ignore
          retention-days: 7

  # The api-gateway is a separate job, not a fifth matrix entry: it needs no Docker
  # (its unit tests are in-process) and has no coverage gate. `make` discovers only
  # *UnitTests* and *IntegrationTests* projects, so the gateway's AuthPath E2E —
  # which boots Keycloak and the whole compose stack — is excluded by name and stays
  # a local/manual gate. See backend/api-gateway/tests/docker-compose.auth-tests.yml.
  gateway:
    name: Build + test the API gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run local CI contract
        run: make -C backend ci SVC=api-gateway

      # Same false-green guard as the service matrix: dotnet reports a skipped test
      # as a pass, so assert the count rather than trusting the exit code.
      - name: Assert no tests were skipped
        run: |
          log="backend/.make-logs/test-api-gateway.log"
          if [ ! -f "$log" ]; then
            echo "::error::Expected test log missing: $log"
            exit 1
          fi
          if grep -hE 'Skipped: *[1-9]' "$log"; then
            echo "::error::Tests were SKIPPED (see the summary lines above). A skip is not a pass."
            exit 1
          fi
          echo "No skipped tests."
          grep -hE 'Passed!' "$log" || true

      - name: Upload make logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-logs-api-gateway
          path: backend/.make-logs/
          if-no-files-found: ignore
          retention-days: 7

  coverage-report:
    name: Aggregate backend coverage reports
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download service coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: backend/coverage/
          merge-multiple: true

      - name: Upload consolidated backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 14
