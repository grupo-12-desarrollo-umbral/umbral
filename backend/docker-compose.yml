services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command:
      - start-dev
      - --import-realm
    depends_on:
      mailpit:
        condition: service_started
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro

  # Local mail catcher. Keycloak points its SMTP server here (see the realm's
  # smtpServer block), so verification and password-reset mail never leaves the
  # machine — it lands in Mailpit's web UI on :8025 for inspection. SMTP listens
  # on :1025 and accepts any/no auth, matching the dev defaults in the realm.
  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # Telemetry sink for the four app services. Traces and logs arrive over OTLP;
  # the services carry no exporter config of their own, only the OTEL_* vars below.
  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: Y
      # 2025.2 refuses to boot on ACCEPT_EULA alone: "No default admin password was supplied".
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8341:80" # UI + query API
      - "5341:5341" # OTLP ingest

  # The four app services run under `dotnet watch`, which exits 255 when a rude edit or a lost
  # console kills the watcher. Without a policy the container just stays dead while the rest of
  # the stack keeps running, which reads as "the service is broken" long after the cause is gone.
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      identity-access-service:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Keycloak__Authority: http://keycloak:8080/realms/umbral
      Keycloak__Audience: umbral-web
      ReverseProxy__Clusters__mission-design__Destinations__d1__Address: http://mission-design-service:8080/
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity-access-service:8080/
      # Base URL; the exporter appends /v1/traces and /v1/logs. Seq serves no /v1/metrics.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      # Mandatory: the exporter defaults to gRPC, Seq speaks OTLP over HTTP only,
      # and the mismatch fails silently — telemetry simply never arrives.
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "8000:8080"

  mission-design-service:
    build:
      context: ./services/mission-design-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__umbral_backendDb: Host=postgres;Port=5432;Database=mission_design;Username=postgres;Password=postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: mission-design-service
    ports:
      - "5001:8080"

  identity-access-service:
    build:
      context: ./services/identity-access-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__umbral_backendDb: Host=postgres;Port=5432;Database=identity_access;Username=postgres;Password=postgres
      # Confidential client-credentials against the umbral realm (see deploy/keycloak/import).
      # The secret is read from the environment, not committed here; the :- fallback is the dev
      # value seeded by the realm import so `docker compose up` works out of the box.
      Keycloak__ClientId: umbral-backend
      Keycloak__ClientSecret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-umbral-backend-dev-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: identity-access-service
    ports:
      - "5002:8080"

  session-operations-service:
    build:
      context: ./services/session-operations-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      api-gateway:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__umbral_backendDb: Host=postgres;Port=5432;Database=session_operations;Username=postgres;Password=postgres
      # RabbitMQ broker for the MassTransit bus (#164), pointing at the compose rabbitmq service.
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      IdentityAccess__BaseAddress: http://identity-access-service:8080/
      PublishedTriviaQuizSource__BaseAddress: http://mission-design-service:8080/
      MissionReadinessSource__BaseAddress: http://mission-design-service:8080/
      MissionRuntimeSource__BaseAddress: http://mission-design-service:8080/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: session-operations-service
    ports:
      - "5003:8080"

  scoring-monitoring-service:
    build:
      context: ./services/scoring-monitoring-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__umbral_backendDb: Host=postgres;Port=5432;Database=scoring_monitoring;Username=postgres;Password=postgres
      # RabbitMQ broker for the MassTransit consumer (#191), pointing at the compose rabbitmq service.
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: /
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: scoring-monitoring-service
    ports:
      - "5004:8080"

volumes:
  postgres-data:
