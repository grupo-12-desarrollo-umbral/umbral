<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-label="Umbral">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="oklch(72% 0.16 48)"/>
      <stop offset="1" stop-color="oklch(66% 0.18 44)"/>
    </linearGradient>
    <radialGradient id="room" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="oklch(25.2% 0.018 58)"/>
      <stop offset="1" stop-color="oklch(18.5% 0.016 58)"/>
    </radialGradient>
  </defs>

  <!-- lantern disc / threshold -->
  <circle cx="66" cy="66" r="60" fill="url(#room)" stroke="url(#ember)" stroke-width="2.5"/>

  <!-- umbral "U" arch: a threshold/doorway motif -->
  <path d="M44 40 L44 74 A22 22 0 0 0 88 74 L88 40"
        fill="none" stroke="url(#ember)" stroke-width="9"
        stroke-linecap="round"/>

  <!-- warm ember wash -->
  <path d="M66 26 A40 40 0 0 1 66 106 A30 30 0 0 0 66 26 Z"
        fill="url(#ember)" opacity="0.14"/>
</svg>
