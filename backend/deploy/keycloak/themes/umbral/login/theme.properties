# Umbral login theme
#
# Extends the stock Keycloak login theme and layers Umbral branding on top.
# `parent=keycloak` inherits every FreeMarker template (login.ftl, register.ftl,
# reset-password, etc.) so we only ship what we override — here, just CSS + logo.
parent=keycloak
import=common/keycloak

# `styles` replaces the parent stylesheet list. We keep the base login.css so the
# stock layout/spacing still works, then append our overrides last so they win.
styles=css/login.css css/umbral.css

# Custom properties consumed by the base template (favicon, etc.).
kcLogoLink=https://umbral.local
